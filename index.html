<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PEMCHOMCHO — Combate Táctico con Fondos y Música 8-Bits</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <span style="font-size:11px;font-weight:bold;color:#c9b8e8;">⚔️ PEMCHOMCHO TÁCTICO</span>
  <button id="audio-toggle" class="audio-btn">🔊 MÚSICA ON</button>
</div>

<canvas id="c" width="640" height="452"></canvas>
<div class="controls-select" id="controls">
  <button id="btn1">◀</button>
  <button id="btn2">Elegir</button>
  <button id="btn3">▶</button>
  <button id="btn4" style="display:none;">Huir</button>
</div>
<p class="hint" id="hint">Usa ◀ ▶ o toca a cada personaje para verlo, Elegir para confirmar.</p>

<!--
  Orden de carga IMPORTANTE: todos los scripts comparten el mismo ámbito
  global (no son módulos), así que cada archivo puede usar variables y
  funciones definidas en los anteriores. main.js va siempre al final
  porque arranca el juego (frame() y updateUI()).
-->
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/biomes.js"></script>
<script src="js/ui-menus.js"></script>
<script src="js/minigames.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
