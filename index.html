<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:var(--bg-dark);--ink:var(--ink-dark);
}

:root[data-theme="light"]{--bg:var(--bg-light);--ink:var(--ink-light)}
:root[data-theme="dark"]{--bg:var(--bg-dark);--ink:var(--ink-dark)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);min-height:100dvh;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:'Courier New',ui-monospace,'Cascadia Code',monospace;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));

  display: flex; justify-content: space-between; align-items: center;
  width: min(92vw, 640px); margin-bottom: -2px;
}
.audio-btn {
  font-family: inherit; font-weight: 700; font-size: 11px;
  padding: 6px 12px; border: 2px solid var(--ink); background: #2b1845; color: #ffd25e;
  cursor: pointer; border-radius: 6px; box-shadow: 0 3px 0 var(--ink);
  transition: all .12s ease; display: inline-flex; align-items: center; gap: 6px;
}
.audio-btn:hover { background: #45246c; transform: translateY(-1px); }

canvas{
  width:min(92vw,640px);aspect-ratio:320/226;
  image-rendering:pixelated;image-rendering:crisp-edges;
  border:3px solid var(--ink);box-shadow:0 0 0 4px var(--bg),0 10px 30px rgba(0,0,0,.5);
  cursor:pointer;touch-action:manipulation;
}

/* Contenedores de Interfaz */
.controls{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;max-width:640px;width:100%}
.controls-select{display:flex;gap:10px;justify-content:center;max-width:640px;width:100%;flex-wrap:wrap;}

/* Botones Generales */
.controls-select button {
  font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.3px;
  padding:10px 18px;border:2px solid var(--ink);background:#251638;color:#fff;
  cursor:pointer;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 var(--ink);transition:all .12s ease;
}
.controls-select button:hover:not(:disabled){background:#422160;transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.controls-select button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.controls-select button:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}

/* Tarjetas de Ataque/Tienda */
.btn-move {
  font-family: inherit;
  border: 2px solid var(--ink);
  border-left: 5px solid var(--move-col, var(--ink));
  background: #221338;
  color: #fff;
  cursor: pointer;
  border-radius: 6px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap:4px;
  text-align: left;
  box-shadow: 0 3px 0 var(--ink);
  transition: all 0.12s ease;
  min-height: 92px;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}
.btn-move::after{
  content:'';position:absolute;inset:0;
  background:var(--move-col, transparent);opacity:.08;pointer-events:none;
}
.btn-move:hover:not(:disabled) {
  background: #3c1e5d;

  box-shadow: 0 5px 0 var(--ink), 0 0 14px 1px var(--move-col, transparent);

.btn-move:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: 0 1px 0 var(--ink);
}
.btn-move:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
  background: #12091d;
}
.btn-move-header {
  display: flex;

  align-items: center;

  margin-bottom: 4px;

.btn-move-name {

.btn-move-desc{font-size:9.5px;line-height:1.3;color:#e4dcf0;font-weight:400;}
.btn-move-cost {

.hint{font-size:11px;opacity:.75;text-align:center;max-width:480px;margin:0;color:#e8dcf5}

const NOTES = {
  C2:65.41, D2:73.42, E2:82.41, F2:87.31, G2:98.00, A2:110.00, B2:123.47,

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function play8BitNote(freq, dur, type='square', vol=0.08) {
  if (isMuted || !audioCtx || freq <= 0) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function play8BitNoise(dur, vol=0.06, isSnare=false) {
  if (isMuted || !audioCtx) return;
  try {
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = isSnare ? 'highpass' : 'lowpass';
    filter.frequency.value = isSnare ? 1200 : 350;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch(e){}
}

function playSFX(type) {
  initAudio();
  if (isMuted) return;
  if (type === 'hit') {
    play8BitNoise(0.12, 0.12, true);
    play8BitNote(NOTES.C3, 0.1, 'sawtooth', 0.12);
  } else if (type === 'crit') {
    play8BitNoise(0.2, 0.15, true);
    play8BitNote(NOTES.G4, 0.15, 'square', 0.15);
    setTimeout(() => play8BitNote(NOTES.C5, 0.2, 'square', 0.15), 50);
  } else if (type === 'click') {
    play8BitNote(NOTES.E5, 0.04, 'square', 0.06);
  } else if (type === 'block') {
    play8BitNote(NOTES.G3, 0.08, 'triangle', 0.15);
    play8BitNote(NOTES.C3, 0.12, 'square', 0.12);
  } else if (type === 'magic') {
    [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5].forEach((n, i) => {
      setTimeout(() => play8BitNote(n, 0.08, 'square', 0.08), i * 35);
    });
  } else if (type === 'victory') {
    const song = [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5];
    song.forEach((n, i) => {
      setTimeout(() => play8BitNote(n, 0.2, 'square', 0.12), i * 140);
    });
  }
}

function setBGM(trackKey) {
  initAudio();
  if (currentTrackKey === trackKey) return;
  currentTrackKey = trackKey;
  bgmStep = 0;
  if (bgmTimer) clearInterval(bgmTimer);
  if (!trackKey || !BGM_TRACKS[trackKey]) return;

  const track = BGM_TRACKS[trackKey];
  const stepTime = (60 / track.bpm / 2) * 1000;

  bgmTimer = setInterval(() => {
    if (isMuted || !audioCtx) return;
    const bNote = track.bass[bgmStep % track.bass.length];
    if (bNote) play8BitNote(bNote, stepTime / 1000 * 0.85, 'triangle', 0.1);

    const lNote = track.lead[bgmStep % track.lead.length];
    if (lNote) play8BitNote(lNote, stepTime / 1000 * 0.75, 'square', 0.06);

    if (bgmStep % 2 === 0 && lNote) {
      play8BitNote(lNote * 1.5, 0.04, 'square', 0.025);
    }

    const drum = track.drums[bgmStep % track.drums.length];
    if (drum === 1) play8BitNoise(0.05, 0.05, false);
    else if (drum === 2) play8BitNoise(0.07, 0.06, true);

    bgmStep++;
  }, stepTime);
}

document.getElementById('audio-toggle').addEventListener('click', () => {
  initAudio();
  isMuted = !isMuted;
  document.getElementById('audio-toggle').textContent = isMuted ? '🔇 MÚSICA OFF' : '🔊 MÚSICA ON';
});

function wrapText(str,x,y,maxW,lh,font){
  g.font=font;g.fillStyle='#2d1e30';g.textAlign='left';
  const words=str.split(' ');let line='',ly=y;
  for(const w of words){
    const test=line+w+' ';
    if(g.measureText(test).width>maxW&&line){g.fillText(line,x,ly);line=w+' ';ly+=lh}
    else line=test;
  }
  g.fillText(line,x,ly);
}

// ---------- FX Visuales ----------
function burstAt(x,y,color,n,spread){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2,sp=(spread*.4)+Math.random()*spread;
    spawnParticle(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,color,1+Math.round(Math.random()),.35+Math.random()*.25);
  }
}

function renderFX(dt){
  activeFX.forEach(fx=>{
    fx.timer+=dt;
    const progress=Math.min(1,fx.timer/fx.dur);
    const {sx,sy,tx,ty,kind}=fx;

    if(kind==='ATK'){
      if(progress<0.3){
        const p=progress/0.3;
        g.globalAlpha=.35+p*.4;
        ball(sx,sy,4+p*7,'#ffffff');
        g.globalAlpha=1;
        if(Math.random()<.5)spawnParticle(sx+(Math.random()-.5)*10,sy+(Math.random()-.5)*10,0,-8,'#ffffff',1,.25);
      }
      else if(progress<0.7){
        const p=(progress-0.3)/0.4;
        const cx=sx+(tx-sx)*p, cy=sy+(ty-sy)*p;
        g.strokeStyle='#ffffff';g.lineWidth=3;
        g.beginPath();g.moveTo(cx-9,cy-9);g.lineTo(cx+9,cy+9);g.stroke();
        g.strokeStyle=fx.col||'#ffd25e';g.lineWidth=1.5;
        g.beginPath();g.moveTo(cx-9,cy+9);g.lineTo(cx+9,cy-9);g.stroke();
        spawnParticle(cx,cy,(Math.random()-.5)*14,(Math.random()-.5)*14,fx.col||'#ffe066',1,.3);
      }
      else{
        if(!fx.burst){
          fx.burst=true;burstAt(tx,ty,'#ffe066',12,55);triggerFlash('#ffffff',.08);
          playSFX('hit');
        }
        const p=(progress-0.7)/0.3;
        g.globalAlpha=Math.max(0,1-p);
        ball(tx,ty,6+p*16,'#ffffff');
        g.globalAlpha=1;
      }
    }
    else if(kind==='BLOCK'){
      const p=progress;
      g.globalAlpha=.9-p*.3;
      ball(sx,sy,16+p*10,'#5b4a7866');ball(sx,sy,9+p*6,'#78b0ff88');
      g.globalAlpha=1;
      if(!fx.burst&&p>0.4){fx.burst=true;burstAt(sx,sy,'#9370db',8,35);playSFX('block')}
    }
    else if(kind==='PARRY'){
      g.globalAlpha=1-progress*.3;
      ball(sx,sy,14+progress*14,'#ffd25e88');
      g.globalAlpha=1;
      if(!fx.burst&&progress>0.35){fx.burst=true;burstAt(sx,sy,'#ffd25e',10,45);playSFX('block')}
    }
    else if(kind==='RECHARGE'){
      for(let i=0;i<3;i++){
        const r=6+((progress+i*.25)%1)*22;
        g.globalAlpha=.5*(1-((progress+i*.25)%1));
        ball(sx,sy,Math.max(1,Math.round(r)),'#30a0ff');
      }
      g.globalAlpha=1;
      if(Math.random()<.6)spawnParticle(sx+(Math.random()-.5)*16,sy+10,(Math.random()-.5)*6,-30,'#30a0ff',1,.4);
      if(!fx.burst){fx.burst=true;playSFX('magic')}
    }
    else if(kind==='BUFF'){
      g.globalAlpha=.75;
      ball(sx,sy,14+Math.sin(progress*Math.PI)*8,'#e0b04066');
      g.globalAlpha=1;
      if(Math.random()<.5)spawnParticle(sx+(Math.random()-.5)*18,sy+(Math.random()-.5)*18,0,-24,'#ffd25e',1,.4);
      if(!fx.burst){fx.burst=true;playSFX('magic')}
    }
    else if(kind==='DEBUFF'){
      const p=progress;
      g.globalAlpha=.7;
      ball(tx,ty,12+p*10,'#d060f055');
      g.globalAlpha=1;
      if(!fx.burst&&p>0.5){fx.burst=true;burstAt(tx,ty,'#d060f0',10,40);playSFX('magic')}
    }
    else if(kind==='COVER'){
      for(let i=0;i<3;i++){
        g.globalAlpha=.35-i*.1;
        R(sx-6-i*6,sy-1,10,2,'#3070b0');
      }
      g.globalAlpha=1;
      if(Math.random()<.5)spawnParticle(sx-8,sy+(Math.random()-.5)*10,-24,0,'#78c8ff',1,.3);
    }

    if(progress>=1 && !fx.hitTriggered){
      fx.hitTriggered=true;
      if(fx.onHit)fx.onHit();
    }
  });
  activeFX=activeFX.filter(fx=>fx.timer<fx.dur);

  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    g.globalAlpha=Math.max(0,p.life/p.maxLife);
    R(p.x,p.y,p.size,p.size,p.color);
  });
  g.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);

  floatingTexts.forEach(ft=>{
    ft.y+=ft.vy*dt;ft.life-=dt;
    g.globalAlpha=Math.max(0,ft.life);
    g.font="bold "+Math.round(9*ft.scale)+"px 'Courier New',monospace";
    g.textAlign='center';
    g.fillStyle=K;g.fillText(ft.text,ft.x+1,ft.y+1);
    g.fillStyle=ft.color;g.fillText(ft.text,ft.x,ft.y);
  });
  g.globalAlpha=1;
  floatingTexts=floatingTexts.filter(ft=>ft.life>0);

  if(flashAlpha>0){
    g.globalAlpha=Math.min(0.6,flashAlpha);
    R(0,0,W,H,flashColor);
    g.globalAlpha=1;
    flashAlpha-=dt;
  }
}

function playMoveFX(moveName,kind,isPlayer,onHitCallback,col){
  const sPos = isPlayer ? {x:65,y:140} : {x:213,y:80};
  const tPos = isPlayer ? {x:213,y:80} : {x:65,y:140};
  const dur = kind==='ATK' ? 0.62 : 0.5;

  activeFX.push({
    type:moveName, kind:kind, col:col, sx:sPos.x, sy:sPos.y, tx:tPos.x, ty:tPos.y,
    timer:0, dur:dur, hitTriggered:false, burst:false, onHit:onHitCallback
  });
}

// ---------- Lógica Táctica de Batalla ----------
function resetCombatStates(){
  pStatus={shield:pStartShield,parry:false,cover:0,buffAtk:1.0,buffCrit:false,stunned:false};
  eStatus={shield:0,parry:false,cover:0,buffAtk:1.0,buffCrit:false,stunned:false};
}

function startBattle(){
  enemyIdx=0;
  playerHP=chars[sel].stats.hp;playerMP=20;
  enemyHP=enemies[0].stats.hp;enemyMP=10;
  dispPHP=playerHP;dispEHP=enemyHP;dispPMP=playerMP;dispEMP=enemyMP;
  resetCombatStates();
  msg='¡Un '+enemies[0].name+' salvaje apareció!';
  state='battle';updateUI();
}
function nextFight(){
  enemyIdx++;
  playerHP=Math.min(chars[sel].stats.hp,playerHP+Math.round(chars[sel].stats.hp*.25));
  playerMP=Math.min(chars[sel].stats.maxMp,playerMP+15);
  enemyHP=enemies[enemyIdx].stats.hp;enemyMP=15;
  dispEHP=enemyHP;dispEMP=enemyMP;
  resetCombatStates();
  msg='¡Un '+enemies[enemyIdx].name+' salvaje apareció!';
  state='battle';updateUI();
}
function retryFight(){
  playerHP=chars[sel].stats.hp;playerMP=20;
  enemyHP=enemies[enemyIdx].stats.hp;enemyMP=10;
  dispPHP=playerHP;dispEHP=enemyHP;dispPMP=playerMP;dispEMP=enemyMP;
  resetCombatStates();
  msg=chars[sel].name+' utiliza sus bonus y reintenta la batalla.';
  state='battle';updateUI();
}
function restartAll(){
  sel=0;enemyIdx=0;points=0;pBonusAtk=1.0;pStartShield=0;
  sparkles=[];activeFX=[];particles=[];floatingTexts=[];
  mgActive=false;mgAttempts=0;mgResult='';
  state='main';updateUI();
}

function applyDamage(isPlayerAttacking,mv,atkr,defr){
  const attackerStatus = isPlayerAttacking ? pStatus : eStatus;
  const defenderStatus = isPlayerAttacking ? eStatus : pStatus;
  const targetPos = isPlayerAttacking ? {x:213,y:80} : {x:65,y:140};

  if(defenderStatus.parry){
    defenderStatus.parry=false;
    spawnFloatText(targetPos.x,targetPos.y-10,'¡PARRY / ESQUIVA!','#ffd25e',1.2);
    playSFX('block');
    msg=(isPlayerAttacking?defr.name:atkr.name)+' paró el ataque y contraataca!';
    const counterDmg=Math.round(atkr.stats.atk*0.4);
    if(isPlayerAttacking){playerHP=Math.max(0,playerHP-counterDmg);playerHit=10;}
    else{enemyHP=Math.max(0,enemyHP-counterDmg);enemyHit=10;}
    return;
  }

  const totalAcc = mv.acc - defenderStatus.cover;
  defenderStatus.cover=0;
  if(Math.random()*100 >= totalAcc){
    spawnFloatText(targetPos.x,targetPos.y-10,'¡FALLÓ!','#b0b0b0');
    msg=atkr.name+' usó '+mv.name+'... ¡pero falló!';
    return;
  }

  let rawDmg = (atkr.stats.atk * mv.pow) - (defr.stats.def * 0.25);
  if(isPlayerAttacking) rawDmg *= pBonusAtk;
  rawDmg *= attackerStatus.buffAtk;
  attackerStatus.buffAtk = 1.0;

  let isCrit = Math.random() < 0.12 || attackerStatus.buffCrit;
  attackerStatus.buffCrit = false;
  if(isCrit) rawDmg *= 1.5;

  let finalDmg = Math.max(3, Math.round(rawDmg + (Math.random()*4-2)));

  if(defenderStatus.shield > 0){
    if(defenderStatus.shield >= finalDmg){
      defenderStatus.shield -= finalDmg;
      spawnFloatText(targetPos.x,targetPos.y-12,`🛡️ BLOQUEADO (-${finalDmg})`,'#a0a0ff',0.9);
      finalDmg = 0;
    } else {
      finalDmg -= defenderStatus.shield;
      spawnFloatText(targetPos.x,targetPos.y-12,`🛡️ ESCUDO ROTO (-${defenderStatus.shield})`,'#a0a0ff',0.9);
      defenderStatus.shield = 0;
    }
  }

  if(finalDmg > 0){
    if(isPlayerAttacking){ enemyHP=Math.max(0,enemyHP-finalDmg); enemyHit=14; }
    else { playerHP=Math.max(0,playerHP-finalDmg); playerHit=14; }

    screenShake = isCrit ? 8 : 4;
    if(isCrit) { triggerFlash('#fff2a0'); playSFX('crit'); }
    else { playSFX('hit'); }

    spawnFloatText(targetPos.x,targetPos.y-12,isCrit?`¡CRÍTICO! -${finalDmg}`:`-${finalDmg}`,isCrit?'#ffd25e':'#ff4d4d',isCrit?1.25:1);
    msg=atkr.name+' usó '+mv.name+'! '+(isCrit?'¡Golpe Crítico! ':'')+'-'+finalDmg+' HP';
  }
}

function startTurn(moveIdx){
  if(resolving)return;
  
  const p=chars[sel], e=enemies[enemyIdx];
  const pm=p.moves[moveIdx];

  if(pm.cost > 0 && playerMP < pm.cost){
    msg='¡No tienes suficiente Energía (MP)!';
    updateUI();return;
  }

  resolving=true;
  playerMP = Math.min(p.stats.maxMp, Math.max(0, playerMP - pm.cost));
  
  const validEMoves = e.moves.filter(m=>m.cost<=enemyMP);
  const em = validEMoves.length > 0 ? validEMoves[Math.floor(Math.random()*validEMoves.length)] : e.moves[0];
  enemyMP = Math.min(e.stats.maxMp, Math.max(0, enemyMP - em.cost));

  const order = p.stats.vel >= e.stats.vel ? [['p',pm],['e',em]] : [['e',em],['p',pm]];
  let stepIdx=0;

  function step(){
    if(stepIdx>=order.length||playerHP<=0||enemyHP<=0){
      resolving=false;
      if(enemyHP<=0){
        const reward = 100 + (enemyIdx + 1) * 25;
        points += reward;
        msg = `¡Victoria! Ganaste +${reward} Pts. Puntos acumulados: ${points}`;
        playSFX('victory');
        state=(enemyIdx===enemies.length-1)?'champion':'victory';
      }
      else if(playerHP<=0){
        msg = `Fuiste derrotado. Puntos acumulados: ${points}`;
        state='defeat';
      }
      updateUI();return;
    }

    const [who,mv]=order[stepIdx++];
    const isPlayer=(who==='p');
    const atkr=isPlayer?p:e;
    const defr=isPlayer?e:p;
    const selfStatus = isPlayer ? pStatus : eStatus;
    const selfPos = isPlayer ? {x:65,y:140} : {x:213,y:80};

    if(selfStatus.stunned){
      selfStatus.stunned=false;
      msg=atkr.name+' está ¡ATURDIDO! y pierde el turno.';
      spawnFloatText(selfPos.x,selfPos.y-10,'¡STUN!','#d060f0',1.2);
      setTimeout(step,800);
      return;
    }

    msg=atkr.name+' usa '+mv.name+'!';

    playMoveFX(mv.name,mv.kind,isPlayer,()=>{
      if(mv.kind==='ATK'){
        applyDamage(isPlayer,mv,atkr,defr);
      }
      else if(mv.kind==='BLOCK'){
        selfStatus.shield += 35;
        spawnFloatText(selfPos.x,selfPos.y-10,'+35 ESCUDO','#5b4a78',1.1);
        msg=atkr.name+' asume postura defensiva (+35 Escudo).';
      }
      else if(mv.kind==='PARRY'){
        selfStatus.parry = true;
        spawnFloatText(selfPos.x,selfPos.y-10,'¡POSTURA PARRY!','#ffd25e',1.1);
        msg=atkr.name+' prepara un contraataque (Parry activo).';
      }
      else if(mv.kind==='COVER'){
        selfStatus.cover = 40;
        spawnFloatText(selfPos.x,selfPos.y-10,'+40% EVASIÓN','#3070b0',1.1);
        msg=atkr.name+' mejora su posicionamiento (+40% Evasión).';
      }
      else if(mv.kind==='RECHARGE'){
        if(isPlayer) playerMP = Math.min(p.stats.maxMp, playerMP + 30);
        else enemyMP = Math.min(e.stats.maxMp, enemyMP + 30);
        spawnFloatText(selfPos.x,selfPos.y-10,'+30 MP','#30a0ff',1.1);
        msg=atkr.name+' recarga sus puntos de energía (+30 MP).';
      }
      else if(mv.kind==='BUFF'){
        selfStatus.buffAtk = 1.5;
        selfStatus.buffCrit = true;
        spawnFloatText(selfPos.x,selfPos.y-10,'¡ATQ & CRÍT. BUFF!','#e0b040',1.1);
        msg=atkr.name+' concentra poder para el próximo ataque.';
      }
      else if(mv.kind==='DEBUFF'){
        if(isPlayer) eStatus.stunned = true;
        else pStatus.stunned = true;
        const targetPos = isPlayer ? {x:213,y:80} : {x:65,y:140};
        spawnFloatText(targetPos.x,targetPos.y-10,'¡ATURDIDO!','#d060f0',1.2);
        msg=atkr.name+' aturde a '+defr.name+' por 1 turno.';
      }

      setTimeout(step,mv.kind==='ATK'?980:820);
    },mv.col);
  }

  step();
}

// ---------- BUCLE PRINCIPAL Y RENDER ----------
function frame(){
  const now=performance.now()/1000,dt=Math.min(.05,now-t);t=now;
  
  if(screenShake>0){
    g.save();
    g.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
    screenShake=Math.max(0,screenShake-dt*20);
  }

  // Selección dinámica de bioma según el estado o enemigo actual
  let currentBiome = 'pradera';
  if(state==='minigames' || state==='mg_timing' || state==='shop') {
    currentBiome = 'templo_dorado';
  } else if(state==='battle' || state==='victory' || state==='defeat' || state==='champion') {
    currentBiome = enemies[enemyIdx].biome;
  }

  drawBiomeBackground(currentBiome, dt);

  if(state==='main'){
    drawMainMenu(dt);
  }else if(state==='select'||state==='confirm'||state==='chosen'){
    if(state!=='chosen'){drawTitle();chars.forEach((c,i)=>drawSlot(c,i))}
    drawDialog();
    if(state==='confirm')drawConfirm();
    if(state==='chosen')drawChosen(dt);
  }else if(state==='minigames'){
    drawMinigamesMenu();
  }else if(state==='mg_timing'){
    drawMinigameTiming(dt);
  }else if(state==='shop'){
    drawShopScene();
  }else{
    drawBattleScene(dt);
  }

  renderFX(dt);

  if(screenShake>0) g.restore();

  requestAnimationFrame(frame);
}
frame();

// ---------- Controles e Interacción ----------
const btn1=document.getElementById('btn1'),btn2=document.getElementById('btn2'),
      btn3=document.getElementById('btn3'),btn4=document.getElementById('btn4'),
      hintEl=document.getElementById('hint'),controlsEl=document.getElementById('controls');

const HINTS={
  main:'Elige la Torre de Lucha para la aventura o prueba los Minijuegos.',
  select:'Usa ◀ ▶ o toca a cada personaje para verlo, Elegir para confirmar.',
  confirm:'Confirma tu elección.',
  chosen:'¡Prepárate para el combate!',
  minigames:'Pon a prueba tus reflejos y gana Puntos extra.',
  mg_timing:'Detén la barra justo en la zona dorada o verde.',
  battle:'Selecciona tus acciones tácticas directamente.',
  shop:'Intercambia tus puntos por mejoras y ventajas tácticas.',
  victory:'¡Excelente pelea! Ve a la tienda de bonus o continúa.',
  defeat:'¿Caíste? Usa tus puntos en la tienda para volver más fuerte.',
  champion:'¡Has vencido a todos los campeones!'
};

function updateUI(){
  hintEl.textContent=HINTS[state];
  
  // Reproducción procedural de BGM según estado
  if(state==='main' || state==='select' || state==='confirm' || state==='chosen') {
    setBGM('title');
  } else if(state==='minigames' || state==='mg_timing' || state==='shop') {
    setBGM('shop');
  } else if(state==='battle') {
    if(enemyIdx >= 4) setBGM('disco');
    else setBGM('battle');
  }

  if(state==='select'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='';btn2.style.display='';btn3.style.display='';btn4.style.display='none';
    btn1.innerHTML='◀';btn2.innerHTML='Elegir';btn3.innerHTML='▶';
    btn1.disabled=false;btn2.disabled=false;btn3.disabled=false;
    btn1.onclick=()=>{playSFX('click');sel=mod(sel-1,3)};
    btn3.onclick=()=>{playSFX('click');sel=mod(sel+1,3)};
    btn2.onclick=()=>{playSFX('click');state='confirm';updateUI()};
  }else if(state==='confirm'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='';btn3.style.display='';btn2.style.display='none';btn4.style.display='none';
    btn1.innerHTML='NO';btn3.innerHTML='SÍ';
    btn1.onclick=()=>{playSFX('click');state='select';updateUI()};
    btn3.onclick=()=>{playSFX('click');state='chosen';sparkles=[];updateUI()};
  }else if(state==='chosen'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='none';btn3.style.display='none';btn2.style.display='';btn4.style.display='none';
    btn2.innerHTML='¡A luchar!';
    btn2.onclick=()=>{playSFX('click');startBattle()};
  }else if(state==='main'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='';btn2.style.display='';btn3.style.display='none';btn4.style.display='none';
    btn1.disabled=false;btn2.disabled=false;
    btn1.innerHTML='⚔️ Torre de Lucha';
    btn2.innerHTML='🎮 Minijuegos';
    btn1.onclick=()=>{playSFX('click');msg='';state='select';updateUI();};
    btn2.onclick=()=>{playSFX('click');state='minigames';updateUI();};
  }else if(state==='minigames'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='';btn2.style.display='';btn3.style.display='none';btn4.style.display='none';
    btn1.disabled=false;btn2.disabled=false;
    btn1.innerHTML='◀ Volver';
    btn2.innerHTML='🎯 Jugar: Golpe Certero';
    btn1.onclick=()=>{playSFX('click');state='main';updateUI();};
    btn2.onclick=()=>startMinigame();
  }else if(state==='mg_timing'){
    controlsEl.className='controls-select';
    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='none';btn3.style.display='none';btn4.style.display='none';btn2.style.display='';
    btn2.disabled=false;
    if(mgActive){ btn2.innerHTML='¡DETENER!'; btn2.onclick=()=>stopMgRound(); }
    else if(mgAttempts>=3){ btn2.innerHTML='Volver a Minijuegos'; btn2.onclick=()=>{playSFX('click');state='minigames';updateUI();}; }
    else{ btn2.innerHTML='🎯 Lanzar'; btn2.onclick=()=>startMgRound(); }
  }else if(state==='battle'){
    controlsEl.className='controls';
    const p=chars[sel];
    btn1.style.display='';btn2.style.display='';btn3.style.display='';btn4.style.display='';
    
    const m=[p.moves[0],p.moves[1],p.moves[2],p.moves[3]];
    [btn1,btn2,btn3,btn4].forEach((btn,idx)=>{
      const mv=m[idx];
      btn.className='btn-move';
      btn.style.setProperty('--move-col', mv.col);
      
      let costClass = 'cost-free';
      let costTxt = '0 MP';
      if(mv.cost > 0) {
        costClass = 'cost-consume';
        costTxt = `-${mv.cost} MP`;
      } else if(mv.cost < 0) {
        costClass = 'cost-gain';
        costTxt = `+${Math.abs(mv.cost)} MP`;
      }

      const powPct = Math.round(Math.min(1, mv.pow/1.5)*100);
      const accCol = mv.acc>=90?'#5cff9d':mv.acc>=75?'#ffd25e':'#ff7878';

      btn.innerHTML = `
        <div class="btn-move-header">
          <span class="btn-move-name">${mv.icon} ${mv.name}</span>
          <span class="btn-move-cost ${costClass}">${costTxt}</span>
        </div>
        <div class="btn-move-stats">
          <span class="btn-move-type" style="background:${mv.col};">${mv.kind}</span>
          <span class="stat-chip">
            <span class="stat-label">PWR</span>
            <span class="stat-bar"><span class="stat-fill" style="width:${powPct}%;background:${mv.col};"></span></span>
          </span>
          <span class="stat-chip">
            <span class="stat-label">ACC</span>
            <span class="stat-bar"><span class="stat-fill" style="width:${mv.acc}%;background:${accCol};"></span></span>
          </span>
        </div>
        <div class="btn-move-desc">${mv.desc}</div>
      `;
      btn.disabled=resolving || (mv.cost > 0 && playerMP < mv.cost);
      btn.onclick=()=>startTurn(idx);
    });
  }else if(state==='shop'){
    controlsEl.className='controls';
    btn1.style.display='';btn2.style.display='';btn3.style.display='';btn4.style.display='';
    
    const p=chars[sel];
    const shopItems=[
      {
        name:'Poción Vida', cost:40, col:'#48a962', icon:'🧪', desc:'+35 HP inmediatos.',
        buy:()=>{ points-=40; playerHP=Math.min(p.stats.hp, playerHP+35); msg='Compraste +35 HP.'; playSFX('magic'); }
      },
      {
        name:'Carga MP', cost:30, col:'#30a0ff', icon:'🧪', desc:'+30 MP inmediatos.',
        buy:()=>{ points-=30; playerMP=Math.min(p.stats.maxMp, playerMP+30); msg='Compraste +30 MP.'; playSFX('magic'); }
      },
      {
        name:'Fuerza Perm.', cost:70, col:'#e0b040', icon:'⚔️', desc:'+15% ATK permanente.',
        buy:()=>{ points-=70; pBonusAtk+=0.15; msg='¡Ataque aumentado +15%! '; playSFX('magic'); }
      },
      {
        name:'Escudo Base', cost:50, col:'#9370db', icon:'🛡️', desc:'+25 Escudo cada combate.',
        buy:()=>{ points-=50; pStartShield+=25; msg='Escudo inicial aumentado a +'+pStartShield+'.'; playSFX('block'); }
      }
    ];

    [btn1,btn2,btn3,btn4].forEach((btn,idx)=>{
      const item=shopItems[idx];
      btn.className='btn-move';
      btn.style.setProperty('--move-col', item.col);
      
      btn.innerHTML = `
        <div class="btn-move-header">
          <span class="btn-move-name">${item.icon} ${item.name}</span>
          <span class="btn-move-cost cost-consume">${item.cost} PTS</span>
        </div>
        <div class="btn-move-body">
          <span>${item.desc}</span>
        </div>
      `;
      btn.disabled = points < item.cost;
      btn.onclick=()=>{
        item.buy();
        updateUI();
      };
    });

    let goBtn = document.getElementById('shop-continue');
    if(!goBtn){
      goBtn = document.createElement('button');
      goBtn.id = 'shop-continue';
      goBtn.style.marginTop = '10px';
      goBtn.style.width = '100%';
      goBtn.style.maxWidth = '640px';
      controlsEl.after(goBtn);
    }
    goBtn.style.display = 'block';
    goBtn.className = 'controls-select';
    goBtn.innerHTML = playerHP <= 0 ? '<button style="width:100%">Reintentar Pelea</button>' : '<button style="width:100%">Siguiente Combate ➔</button>';
    goBtn.onclick=()=>{
      playSFX('click');
      goBtn.style.display='none';
      if(playerHP <= 0) retryFight();
      else nextFight();
    };

  }else if(state==='victory'||state==='defeat'||state==='champion'){
    controlsEl.className='controls-select';
    const goBtn = document.getElementById('shop-continue');
    if(goBtn) goBtn.style.display='none';

    [btn1,btn2,btn3,btn4].forEach(b=>{b.className='';});
    btn1.style.display='none';btn3.style.display='none';btn4.style.display='none';btn2.style.display='';
    btn2.disabled=false;
    
    if(state==='victory'){
      btn1.style.display='';
      btn1.innerHTML='🏪 Tienda de Bonus';
      btn1.onclick=()=>{ playSFX('click'); state='shop'; updateUI(); };

      btn2.innerHTML='Siguiente combate ➔';
      btn2.onclick=()=>{ playSFX('click'); nextFight(); };
    }else if(state==='defeat'){
      if(points >= 30){
        btn1.style.display='';
        btn1.innerHTML='🏪 Tienda de Bonus ('+points+' Pts)';
        btn1.onclick=()=>{ playSFX('click'); state='shop'; updateUI(); };
      }
      btn2.innerHTML='Reintentar';
      btn2.onclick=()=>{ playSFX('click'); retryFight(); };
    }else if(state==='champion'){
      btn2.innerHTML='Jugar de nuevo';
      btn2.onclick=()=>{ playSFX('click'); restartAll(); };
    }
  }
}
updateUI();

cvs.addEventListener('mousemove',e=>{
  const rect=cvs.getBoundingClientRect();
  mousePos.x=(e.clientX-rect.left)/rect.width*W;
  mousePos.y=(e.clientY-rect.top)/rect.height*H;
});
</script>
